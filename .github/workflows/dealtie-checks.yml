name: DealTie checks
on:
  push:
    branches: [main, production-readiness, rebuild-transaction-control]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r dealtie/requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s dealtie/tests -v
      - name: Compile Python modules
        run: python -m compileall -q dealtie
