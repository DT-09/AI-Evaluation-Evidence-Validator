name: DealTie tests
on:
  push:
    branches: [main, financial-evidence-reconciliation]
    paths: ['dealtie/**', '.github/workflows/dealtie-tests.yml']
  pull_request:
    paths: ['dealtie/**', '.github/workflows/dealtie-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r dealtie/requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s dealtie/tests -v
      - run: python -m compileall -q dealtie
